[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hybrid-agent"
version = "0.1.0"
description = "A local-first, hybrid AI agent with graduated autonomy."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Jon and Johnnie" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.9"]

[project.scripts]
hybrid-agent = "hybrid_agent.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/hybrid_agent"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
