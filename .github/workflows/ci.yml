name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install development dependencies
        run: python -m pip install -e '.[dev]'
      - name: Lint and security rules
        run: ruff check src tests scripts
      - name: Static type checking
        run: mypy
      - name: Unit and regression tests
        run: pytest --cov=hybrid_agent --cov-report=term-missing --cov-fail-under=60
      - name: Compile Python sources
        run: python -m compileall -q src tests scripts training/colab
      - name: Validate shell and JSON syntax
        run: |
          bash -n scripts/create_colab_bundle.sh
          find . -type f -name '*.json' -print0 | xargs -0 -n1 python -m json.tool >/dev/null
      - name: Audit runtime and training dependencies
        run: |
          pip-audit .
          pip-audit --requirement training/requirements-qlora-v1.txt
